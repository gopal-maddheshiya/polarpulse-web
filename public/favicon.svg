<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: Deep Glacial Space Navy -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040d16" />
      <stop offset="50%" stop-color="#071829" />
      <stop offset="100%" stop-color="#0b243b" />
    </linearGradient>

    <!-- Polaris Star Primary Ray Gradient -->
    <linearGradient id="starRay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Star Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container with Ice Blue Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.85" />

  <!-- Outer Concentric Polar Latitude Ring -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="2 3" opacity="0.45" />

  <!-- Inner Polar Coordinate Ring -->
  <circle cx="32" cy="32" r="16.5" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.35" />

  <!-- Meridian Coordinate Crosshairs -->
  <line x1="32" y1="8" x2="32" y2="56" stroke="#0284c7" stroke-width="0.75" stroke-dasharray="3 3" opacity="0.4" />
  <line x1="8" y1="32" x2="56" y2="32" stroke="#0284c7" stroke-width="0.75" stroke-dasharray="3 3" opacity="0.4" />

  <!-- 4 Diagonal Secondary Ray Shards (NE, NW, SE, SW) -->
  <g fill="#0284c7" opacity="0.8">
    <!-- NE -->
    <polygon points="32,32 46,18 36,30" fill="#38bdf8" />
    <polygon points="32,32 46,18 30,36" fill="#0284c7" />
    <!-- NW -->
    <polygon points="32,32 18,18 28,34" fill="#38bdf8" />
    <polygon points="32,32 18,18 34,28" fill="#0284c7" />
    <!-- SE -->
    <polygon points="32,32 46,46 34,28" fill="#38bdf8" />
    <polygon points="32,32 46,46 28,34" fill="#0284c7" />
    <!-- SW -->
    <polygon points="32,32 18,46 36,30" fill="#38bdf8" />
    <polygon points="32,32 18,46 30,36" fill="#0284c7" />
  </g>

  <!-- 4 Cardinal Primary Diamond Rays (North, South, East, West) with Glow -->
  <g filter="url(#glow)">
    <!-- NORTH (Main Polaris Navigational Ray - Longer) -->
    <polygon points="32,6 35.5,28 32,32" fill="#ffffff" />
    <polygon points="32,6 28.5,28 32,32" fill="#38bdf8" />

    <!-- SOUTH -->
    <polygon points="32,58 35.5,36 32,32" fill="#38bdf8" />
    <polygon points="32,58 28.5,36 32,32" fill="#0284c7" />

    <!-- EAST -->
    <polygon points="58,32 36,35.5 32,32" fill="#ffffff" />
    <polygon points="58,32 36,28.5 32,32" fill="#38bdf8" />

    <!-- WEST -->
    <polygon points="6,32 28,35.5 32,32" fill="#38bdf8" />
    <polygon points="6,32 28,28.5 32,32" fill="#0284c7" />
  </g>

  <!-- Glowing Navigational Core -->
  <circle cx="32" cy="32" r="4.5" fill="#38bdf8" opacity="0.6" filter="url(#glow)" />
  <circle cx="32" cy="32" r="2.8" fill="#ffffff" />
</svg>
